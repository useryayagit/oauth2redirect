<h1 id="pageTitle">Initial Text</h1>

<script>
    // 立即执行 - 会覆盖 Initial Text
    console.log('Script executing at:', new Date().toLocaleTimeString());
    var titleFromUrl = new URLSearchParams(window.location.search).get('title');
    document.getElementById('pageTitle').innerHTML = titleFromUrl || 'No Title';
    
    // window.onload - 延迟执行
    window.onload = function() {
        console.log('onload at:', new Date().toLocaleTimeString());
         
    };
</script>
