 <!DOCTYPE html>
   <html>
   <head>
       <title>OAuth2 Redirect Test</title>
   </head>
   <body>
       <h1>OAuth2 Redirect Test Page</h1>
       <p>Code: <span id="code"></span></p>
       <script>
           // 获取 URL 参数
           const urlParams = new URLSearchParams(window.location.search);
           const code = urlParams.get('code');
           document.getElementById('code').textContent = code;
           
           // 可以尝试启动 Android App
           // window.location.href = "magichome://oauth2redirect?code=" + code;
       </script>
   </body>
   </html>
