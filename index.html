<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚠️ 安全测试警告</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #fff3cd;
        }
        .warning {
            background: #dc3545;
            color: white;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .info {
            background: #17a2b8;
            color: white;
            padding: 15px;
            border-radius: 5px;
        }
        code {
            background: #343a40;
            color: #00ff00;
            padding: 10px;
            display: block;
            margin: 10px 0;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="warning">
        <h1>⚠️ 安全测试警告</h1>
        <p><strong>这是一个钓鱼攻击测试页面！</strong></p>
        <p>如果这是真实攻击，您的百度账号密码已经被窃取。</p>
    </div>
    
    <div class="info">
        <h3>测试信息：</h3>
        <p><strong>测试时间：</strong><span id="time"></span></p>
        <p><strong>攻击已验证：</strong>是</p>
        <p><strong>数据已保存：</strong>否（仅测试）</p>
    </div>
    
    <h3>获取到的 URL 参数：</h3>
    <div id="params"></div>
    
    <hr/>
    <p style="color:red;"><strong>请立即修复 GrantWebActivity 漏洞！</strong></p>
    
    <script>
        // 显示时间
        document.getElementById('time').textContent = new Date().toLocaleString('zh-CN');
        
        // 解析 URL 参数
        const urlParams = new URLSearchParams(window.location.search);
        let paramsHtml = '<ul>';
        for (const [key, value] of urlParams.entries()) {
            paramsHtml += `<li><strong>${key}:</strong> ${value}</li>`;
        }
        paramsHtml += '</ul>';
        document.getElementById('params').innerHTML = paramsHtml;
        
        // 在控制台输出（用于调试）
        console.log('=== 安全测试 ===');
        for (const [key, value] of urlParams.entries()) {
            console.log(`${key}: ${value}`);
        }
    </script>
</body>
</html>
